<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Shared Solution - Secure Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #0a0e1a;
            overflow-x: hidden;
        }

        /* Background with blur effect */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://media.istockphoto.com/id/1460762245/photo/modern-style-hi-rise-blue-glass-building-exterior-with-transparent-wall-3d-render.jpg?s=612x612&w=0&k=20&c=a5V0dIHugs_dfzKDHP4NP6WR3lc00vA0wDpaMBrai3o=');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(15px) brightness(0.2);
            transform: scale(1.1);
            z-index: -2;
        }

        /* Overlay for better contrast */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 14, 26, 0.95) 0%, 
                rgba(30, 58, 138, 0.85) 35%, 
                rgba(15, 23, 42, 0.98) 100%);
            z-index: -1;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(25px);
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: white;
        }

        .header-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-logo-text {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #10b981;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .verification-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 
                0 32px 64px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            margin-top: 80px;
            animation: slideInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .verification-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.6), transparent);
            z-index: 1;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .bank-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border-radius: 20px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            box-shadow: 0 12px 30px rgba(30, 64, 175, 0.3);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            color: #1e293b;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .subtitle {
            color: #475569;
            font-size: 1.125rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-weight: 400;
        }

        .email-highlight {
            color: #1e40af;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 0.95em;
        }

        .code-inputs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .code-input {
            width: 64px;
            height: 64px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            color: #1e293b;
            background: #fafbfc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
        }

        .code-input:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-3px) scale(1.05);
        }

        .code-input:hover:not(:focus) {
            border-color: #cbd5e1;
            background: white;
            transform: translateY(-1px);
        }

        .code-input.filled {
            border-color: #3b82f6;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1e40af;
            transform: translateY(-2px);
        }

        .code-input.error {
            border-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .verify-btn {
            width: 100%;
            padding: 1.125rem 2rem;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
            min-height: 60px;
        }

        .verify-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .verify-btn:hover::before {
            left: 100%;
        }

        .verify-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
        }

        .verify-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .verify-btn:disabled {
            background: linear-gradient(135deg, #9ca3af, #6b7280);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .verify-btn:disabled::before {
            display: none;
        }

        .verify-btn.loading {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-spinner {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .resend-section {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .resend-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .resend-link:hover {
            color: #1e40af;
            background: rgba(59, 130, 246, 0.1);
            text-decoration: none;
        }

        .timer {
            color: #ef4444;
            font-weight: 600;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(100, 116, 139, 0.2);
        }

        .back-link:hover {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.2);
            transform: translateY(-1px);
        }

        .security-info {
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #166534;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            line-height: 1.5;
        }

        .security-info::before {
            content: "🔒";
            font-size: 1.1rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }
            
            .header-logo-text {
                display: none;
            }
            
            .verification-container {
                padding: 2rem 1.5rem;
                margin: 100px 10px 20px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .subtitle {
                font-size: 1rem;
                margin-bottom: 2rem;
            }
            
            .code-inputs {
                gap: 0.75rem;
                margin-bottom: 2rem;
            }
            
            .code-input {
                width: 52px;
                height: 52px;
                font-size: 1.5rem;
                border-radius: 12px;
            }
            
            .bank-logo {
                width: 64px;
                height: 64px;
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .verification-container {
                padding: 1.5rem 1rem;
                margin: 90px 5px 20px;
            }
            
            .code-inputs {
                gap: 0.5rem;
            }
            
            .code-input {
                width: 44px;
                height: 44px;
                font-size: 1.25rem;
                border-radius: 10px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .verify-btn {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 360px) {
            .code-inputs {
                gap: 0.25rem;
            }
            
            .code-input {
                width: 40px;
                height: 40px;
                font-size: 1.125rem;
            }
        }

        .success-animation {
            animation: successPulse 0.4s ease-in-out;
        }

        @keyframes successPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .loading-content .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="background-container"></div>
    <div class="overlay"></div>
    
    <header class="header">
        <div class="header-logo">
            <div class="header-logo-icon">
                <i class="fas fa-university"></i>
            </div>
            <div class="header-logo-text">Success Shared Solution</div>
        </div>
        <div class="security-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Secure Verification</span>
        </div>
    </header>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Verifying your code...</p>
        </div>
    </div>

    <div class="verification-container">
        <div class="bank-logo">
            <i class="fas fa-shield-check"></i>
        </div>
        
        <h1>Secure Verification</h1>
        <p class="subtitle">
            We've sent a 6-digit security code to<br>
            <span class="email-highlight">{{ email }}</span>
        </p>
        
        <div class="code-inputs">
            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" autocomplete="one-time-code">
            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
        </div>

        <button class="verify-btn" id="verifyBtn" disabled>
            <span id="buttonText">Verify & Continue</span>
        </button>

        <div class="resend-section">
            Didn't receive the code? 
            <span class="resend-link" id="resendLink">Resend Code</span>
            <span id="timer" class="timer" style="display: none;"></span>
        </div>

        <a href="{% url 'auth_view' %}" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Login
        </a>

        <div class="security-info">
            Your verification code is encrypted and will expire in 10 minutes for your security.
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.code-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const buttonText = document.getElementById('buttonText');
        const resendLink = document.getElementById('resendLink');
        const timer = document.getElementById('timer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        let resendTimer = 60;
        let timerInterval;
        let isVerifying = false;

        // Auto-focus and navigation logic
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                // Clear error state
                e.target.classList.remove('error');
                
                // Add filled class for styling
                if (value) {
                    e.target.classList.add('filled');
                    e.target.classList.add('success-animation');
                    setTimeout(() => e.target.classList.remove('success-animation'), 400);
                } else {
                    e.target.classList.remove('filled');
                }
                
                // Auto-move to next input
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                // Check if all inputs are filled
                checkAllInputsFilled();
            });
            
            input.addEventListener('keydown', (e) => {
                // Handle backspace
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].classList.remove('error');
                }
                
                // Handle arrow keys
                if (e.key === 'ArrowLeft' && index > 0) {
                    inputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                // Handle Enter key
                if (e.key === 'Enter' && !verifyBtn.disabled) {
                    verifyBtn.click();
                }
            });
            
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text');
                handlePaste(index, pastedData);
            });

            // Add focus/blur effects
            input.addEventListener('focus', () => {
                input.classList.remove('error');
            });
        });

        function handlePaste(startIndex, pastedData) {
            if (!pastedData) return;
            
            const numbers = pastedData.replace(/\D/g, '').slice(0, 6);
            
            // Clear all inputs first
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('filled', 'error');
            });
            
            // Fill inputs with pasted numbers
            for (let i = 0; i < numbers.length && i < inputs.length; i++) {
                const input = inputs[i];
                input.value = numbers[i];
                input.classList.add('filled');
                input.classList.add('success-animation');
                setTimeout(() => input.classList.remove('success-animation'), 400);
            }
            
            // Focus on the next empty input or the last one
            const nextEmptyIndex = Math.min(numbers.length, inputs.length - 1);
            inputs[nextEmptyIndex].focus();
            
            checkAllInputsFilled();
        }

        function checkAllInputsFilled() {
            const allFilled = Array.from(inputs).every(input => input.value);
            verifyBtn.disabled = !allFilled || isVerifying;
            
            if (allFilled) {
                verifyBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                buttonText.textContent = 'Verify & Continue';
            } else {
                verifyBtn.style.background = 'linear-gradient(135deg, #3b82f6, #1e40af)';
                buttonText.textContent = 'Enter Complete Code';
            }
        }

        function setLoadingState(loading) {
            isVerifying = loading;
            
            if (loading) {
                verifyBtn.classList.add('loading');
                verifyBtn.disabled = true;
                buttonText.innerHTML = '<div class="loading-spinner"></div>Verifying...';
                loadingOverlay.style.display = 'flex';
                
                // Disable inputs
                inputs.forEach(input => input.disabled = true);
            } else {
                verifyBtn.classList.remove('loading');
                buttonText.innerHTML = 'Verify & Continue';
                loadingOverlay.style.display = 'none';
                
                // Re-enable inputs
                inputs.forEach(input => input.disabled = false);
                checkAllInputsFilled();
            }
        }

        function showError(message) {
            // Add error styling to inputs
            inputs.forEach(input => {
                input.classList.add('error');
                input.value = '';
                input.classList.remove('filled');
            });
            
            // Focus first input
            inputs[0].focus();
            
            // Show error message
            alert(message);
        }

        function startResendTimer() {
            resendTimer = 60;
            resendLink.style.display = 'none';
            timer.style.display = 'inline';
            
            timerInterval = setInterval(() => {
                resendTimer--;
                timer.textContent = `(${resendTimer}s)`;
                
                if (resendTimer <= 0) {
                    clearInterval(timerInterval);
                    resendLink.style.display = 'inline';
                    timer.style.display = 'none';
                }
            }, 1000);
        }

        verifyBtn.addEventListener('click', () => {
            if (isVerifying) return;
            
            const code = Array.from(inputs).map(i => i.value).join('');
            const email = localStorage.getItem('emailForVerification');

            if (!email) {
                showError('No email found for verification. Please go back and login again.');
                return;
            }

            if (code.length !== 6) {
                showError('Please enter the complete 6-digit code.');
                return;
            }

            setLoadingState(true);

            // Add CSRF token
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                             document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
 
            fetch('/verification/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken || ''
                },
                body: JSON.stringify({ email, code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.redirect) {
                    // Show success state briefly before redirect
                    buttonText.innerHTML = '<i class="fas fa-check"></i>Verified Successfully!';
                    verifyBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    setLoadingState(false);
                    showError(data.message || 'Invalid verification code. Please try again.');
                }
            })
            .catch(error => {
                console.error('Verification error:', error);
                setLoadingState(false);
                showError("Connection error. Please check your network and try again.");
            });
        });

        // Resend code functionality
        resendLink.addEventListener('click', () => {
            if (isVerifying) return;
            
            // Clear all inputs
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('filled', 'error');
            });
            
            inputs[0].focus();
            verifyBtn.disabled = true;
            startResendTimer();
            
            // Here you would typically make an API call to resend the code
            console.log('Resending verification code...');
            
            // Show confirmation
            const originalText = resendLink.textContent;
            resendLink.textContent = 'Code Sent!';
            resendLink.style.color = '#10b981';
            
            setTimeout(() => {
                resendLink.textContent = originalText;
                resendLink.style.color = '#3b82f6';
            }, 2000);
        });

        // Initialize
        startResendTimer();
        inputs[0].focus();
        
        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // ESC to clear all inputs
            if (e.key === 'Escape') {
                inputs.forEach(input => {
                    input.value = '';
                    input.classList.remove('filled', 'error');
                });
                inputs[0].focus();
                checkAllInputsFilled();
            }
        });

        // Prevent form submission on Enter in inputs
        inputs.forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!verifyBtn.disabled) {
                        verifyBtn.click();
                    }
                }
            });
        });
    </script>
</body>
</html>
